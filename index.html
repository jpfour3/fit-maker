<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitLab</title><style>body{margin:0;background:#090909;color:#eee;font-family:Arial,sans-serif}header{padding:18px;border-bottom:1px solid #292929;position:sticky;top:0;background:#090909}h1{margin:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{background:#171717;color:#eee;border:1px solid #333;border-radius:9px;padding:9px 12px}button.active{background:#eee;color:#111}main{max-width:1100px;margin:auto;padding:20px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:#111;border:1px solid #292929;border-radius:15px;padding:16px}label{display:block;color:#bbb;font-size:13px;margin:11px 0 5px}input,select{width:100%;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #333;border-radius:8px;padding:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:11px;border:1px solid #333;border-radius:9px;color:#aaa}.modelbox{height:570px;background:#151515;border:1px solid #292929;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;perspective:1000px}.model{position:relative;width:250px;height:520px;transform-style:preserve-3d;transition:transform .35s}.head{position:absolute;top:4px;left:92px;width:66px;height:78px;background:#000;border-radius:50%}.neck{position:absolute;top:70px;left:106px;width:38px;height:50px;background:#000}.torso{position:absolute;top:104px;left:55px;width:140px;height:190px;background:#000;border-radius:45% 45% 23% 23%}.arm{position:absolute;top:112px;width:38px;height:190px;background:#000;border-radius:22px}.arm.l{left:21px;transform:rotate(6deg)}.arm.r{right:21px;transform:rotate(-6deg)}.leg{position:absolute;top:283px;width:58px;height:224px;background:#000;border-radius:20px}.leg.l{left:61px}.leg.r{right:61px}.layers{position:absolute;inset:0;transform-style:preserve-3d}.layer{position:absolute;left:50%;transform:translateX(-50%);object-fit:contain;max-width:190px;pointer-events:none}.shirt{top:112px;max-height:185px}.hoodie,.zipup{top:104px;max-height:195px}.bottom{top:280px;max-height:190px}.socks{top:420px;max-height:80px}.shoes{top:468px;max-height:55px}.necklace{top:119px;max-height:110px}.itemlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:15px}.item{background:#151515;border:1px solid #292929;border-radius:12px;padding:10px}.item img{width:100%;height:150px;object-fit:contain;background:#090909;border-radius:8px}.item button{margin-top:7px}.preview{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.preview img{width:100%;height:110px;object-fit:contain;background:#090909;border-radius:7px}.muted{color:#888;font-size:13px}</style></head><body><header><h1>FitLab</h1><div class="tabs"><button class="active" onclick="page('builder',this)">Builder</button><button onclick="page('closet',this)">My Closet</button><button onclick="page('fits',this)">Fits</button><button onclick="page('measure',this)">Body Measurements</button></div></header><main><section id="builder" class="page active"><div class="grid"><div class="card"><div class="row"><button onclick="turn(-180)">Front</button><button onclick="turn(180)">Back</button><button onclick="threeD()">2D / 3D</button><button onclick="clearModel()">Clear</button></div><div class="modelbox"><div id="model" class="model"><div class="head"></div><div class="neck"></div><div class="torso"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div><div id="layers" class="layers"></div></div></div><p id="mode" class="muted">2D mode</p></div><div><div class="card"><h2>Add Clothing</h2><div class="notice">Upload two pictures for every item: front and back.</div><label>Category</label><select id="cat"><option>Shirts</option><option>Hoodies</option><option>Zip-ups</option><option>Shorts</option><option>Pants</option><option>Socks</option><option>Shoes</option><option>Necklaces</option></select><label>Item name</label><input id="name" placeholder="black zip-up"><label>Front photo</label><input id="front" type="file" accept="image/*"><label>Back photo</label><input id="back" type="file" accept="image/*"><div id="preview" class="preview" style="display:none"><img id="pf"><img id="pb"></div><button style="margin-top:12px" onclick="add()">Add to Closet</button></div><div class="card" style="margin-top:16px"><h3>Selected</h3><div id="selected" class="muted">Nothing selected</div></div></div></div></section><section id="closet" class="page"><div class="card"><h2>My Closet</h2><div id="closetList" class="itemlist"></div></div></section><section id="fits" class="page"><div class="card"><h2>Fits</h2><input id="fitName" placeholder="fit name"><button style="margin-top:10px" onclick="saveFit()">Save Current Fit</button><div id="fitsList" class="itemlist"></div></div></section><section id="measure" class="page"><div class="card"><h2>Body Measurements</h2><div class="notice">Use inches. Measure one arm only, not wingspan.</div><div class="grid"><div><label>Waist to neck</label><input data-m="waistNeck" type="number" step=".1"></div><div><label>One arm length</label><input data-m="armLength" type="number" step=".1"></div><div><label>Shoulder length</label><input data-m="shoulderLength" type="number" step=".1"></div><div><label>Neck height</label><input data-m="neckHeight" type="number" step=".1"></div><div><label>Head height</label><input data-m="headHeight" type="number" step=".1"></div><div><label>Leg length</label><input data-m="legLength" type="number" step=".1"></div><div><label>US men's shoe size range</label><input data-m="shoeSize" placeholder="9–9.5"></div></div><button style="margin-top:14px" onclick="saveMeasures()">Save Measurements</button><p id="saved" class="muted"></p></div></section></main><script>let closet=JSON.parse(localStorage.fitlabCloset||'[]'),fits=JSON.parse(localStorage.fitlabFits||'[]'),rot=0,is3=false;function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderCloset();renderFits()}function data(f){return new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}async function add(){let f=front.files[0],b=back.files[0];if(!f||!b)return alert('Add both front and back photos.');closet.push({id:Date.now(),name:name.value||f.name,cat:cat.value,front:await data(f),back:await data(b)});localStorage.fitlabCloset=JSON.stringify(closet);name.value='';front.value='';back.value='';preview.style.display='none';renderCloset()}function cls(c){return c==='Shirts'?'shirt':c==='Hoodies'?'hoodie':c==='Zip-ups'?'zipup':c==='Shorts'||c==='Pants'?'bottom':c.toLowerCase().replace('necklaces','necklace')}function put(id){let x=closet.find(a=>a.id===id),c=cls(x.cat),o=document.querySelector('.layer.'+c);if(o)o.remove();let i=document.createElement('img');i.className='layer '+c;i.dataset.f=x.front;i.dataset.b=x.back;i.src=rot===180?x.back:x.front;layers.appendChild(i);selected.textContent=x.name+' · '+x.cat}function turn(v){rot=(rot+v+360)%360;if(rot!==0)rot=180;model.style.transform='rotateY('+rot+'deg) rotateX('+(is3?8:0)+'deg)';document.querySelectorAll('.layer').forEach(i=>i.src=rot===180?i.dataset.b:i.dataset.f)}function threeD(){is3=!is3;model.style.transform='rotateY('+rot+'deg) rotateX('+(is3?8:0)+'deg) scale('+(is3?1.03:1)+')';mode.textContent=is3?'3D mode':'2D mode'}function clearModel(){layers.innerHTML='';selected.textContent='Nothing selected'}function renderCloset(){closetList.innerHTML='';closet.forEach(x=>{let d=document.createElement('div');d.className='item';d.innerHTML='<img src="'+x.front+'"><b>'+esc(x.name)+'</b><div class="muted">'+x.cat+'</div><button onclick="put('+x.id+')">Put on model</button><button onclick="del('+x.id+')">Delete</button>';closetList.appendChild(d)})}function del(id){closet=closet.filter(x=>x.id!==id);localStorage.fitlabCloset=JSON.stringify(closet);renderCloset()}function saveFit(){let n=fitName.value||'Untitled fit';fits.push({n,html:layers.innerHTML});localStorage.fitlabFits=JSON.stringify(fits);renderFits()}function renderFits(){fitsList.innerHTML='';fits.forEach((f,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML='<b>'+esc(f.n)+'</b><br><button onclick="loadFit('+i+')">Load</button><button onclick="fits.splice('+i+',1);localStorage.fitlabFits=JSON.stringify(fits);renderFits()">Delete</button>';fitsList.appendChild(d)})}function loadFit(i){layers.innerHTML=fits[i].html;document.querySelectorAll('.layer').forEach(x=>x.src=rot===180?x.dataset.b:x.dataset.f)}function saveMeasures(){let m={};document.querySelectorAll('[data-m]').forEach(x=>m[x.dataset.m]=x.value);localStorage.fitlabMeasures=JSON.stringify(m);saved.textContent='Saved on this device.'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}front.onchange=back.onchange=()=>{if(front.files[0]||back.files[0]){preview.style.display='grid';if(front.files[0])pf.src=URL.createObjectURL(front.files[0]);if(back.files[0])pb.src=URL.createObjectURL(back.files[0])}}renderCloset();renderFits();</script></body></html>
