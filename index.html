<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitLab</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#eee;font-family:Arial,sans-serif}header{padding:18px 20px;border-bottom:1px solid #29292e;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.tabs{display:flex;gap:8px;padding:12px;overflow:auto;border-bottom:1px solid #222}.tabs button,.btn{background:#17171b;color:#eee;border:1px solid #303038;border-radius:10px;padding:10px 14px;cursor:pointer}.tabs button.active,.btn.primary{background:#eee;color:#111}.page{display:none;padding:18px;max-width:1100px;margin:auto}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:#141418;border:1px solid #292930;border-radius:14px;padding:14px}.stage{height:620px;background:#101014;border:1px solid #292930;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.model{width:260px;height:540px;position:relative}.body{position:absolute;left:75px;top:70px;width:110px;height:250px;background:#b99b83;border-radius:50px 50px 25px 25px}.head{position:absolute;left:95px;top:10px;width:70px;height:70px;background:#b99b83;border-radius:50%}.leg{position:absolute;top:300px;width:48px;height:220px;background:#b99b83;border-radius:20px}.leg.l{left:78px}.leg.r{left:134px}.arm{position:absolute;top:85px;width:38px;height:210px;background:#b99b83;border-radius:20px}.arm.l{left:30px;transform:rotate(5deg)}.arm.r{right:30px;transform:rotate(-5deg)}.item{position:absolute;z-index:3;pointer-events:none}.shirt{left:60px;top:72px;width:140px;height:190px;background:#eee;border-radius:30px 30px 20px 20px}.hoodie{left:52px;top:64px;width:156px;height:205px;background:#333;border-radius:32px 32px 22px 22px;z-index:5}.pants{left:65px;top:260px;width:150px;height:275px;background:#202020;border-radius:15px;z-index:2}.shorts{left:65px;top:260px;width:150px;height:150px;background:#555;border-radius:15px;z-index:2}.shoe{bottom:0;width:85px;height:35px;background:#eee;border-radius:20px 35px 12px 12px;z-index:6}.shoe.l{left:52px}.shoe.r{right:52px}.necklace{left:78px;top:70px;width:104px;height:100px;border:5px solid #d4b45a;border-top-color:transparent;border-radius:50%;z-index:8}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select{width:100%;background:#101014;color:#eee;border:1px solid #333;border-radius:9px;padding:10px}label{display:block;font-size:12px;color:#aaa;margin-bottom:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.closet-item{min-height:120px;display:flex;flex-direction:column;gap:8px;justify-content:center}.muted{color:#999;font-size:13px}@media(max-width:600px){.stage{height:540px}.model{transform:scale(.85)}.two{grid-template-columns:1fr}}
</style></head><body><header><h1>FitLab</h1><span class="muted">Outfit Builder</span></header><nav class="tabs"><button class="active" data-page="builder">Builder</button><button data-page="closet">My Closet</button><button data-page="fits">Fits</button><button data-page="body">Body</button></nav>
<section id="builder" class="page active"><div class="controls"><button class="btn" id="view2d">2D</button><button class="btn" id="view3d">3D</button><button class="btn" id="turn">Front / Back</button><button class="btn primary" id="saveFit">Save Fit</button></div><div class="stage"><div class="model" id="model"><div class="head"></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div></div></div><div class="grid" style="margin-top:14px"><div class="card"><b>Add item</b><select id="cat"><option>Shirts</option><option>Hoodies</option><option>Shorts</option><option>Pants</option><option>Socks</option><option>Shoes</option><option>Necklaces</option></select><input id="itemName" placeholder="Item name" style="margin-top:8px"><input id="itemColor" placeholder="Color" style="margin-top:8px"><button class="btn primary" id="add" style="margin-top:8px;width:100%">Add to outfit</button></div><div class="card"><b>Adjust</b><p class="muted">Move / scale / zip position controls for the selected layer.</p><label>Vertical</label><input type="range" id="pos" min="-40" max="40" value="0"><label>Scale</label><input type="range" id="scale" min="70" max="130" value="100"><label>Zip position</label><input type="range" id="zip" min="0" max="100" value="50"></div></div></section>
<section id="closet" class="page"><h2>My Closet</h2><p class="muted">Items are stored on this device.</p><div id="closetGrid" class="grid"></div></section><section id="fits" class="page"><h2>Saved Fits</h2><div id="fitsGrid" class="grid"></div></section><section id="body" class="page"><h2>Body Measurements</h2><div class="two"><div class="card"><label>Height (in)</label><input data-body="height"><label>Shoulder width (in)</label><input data-body="shoulders"><label>Chest (in)</label><input data-body="chest"><label>Waist (in)</label><input data-body="waist"><label>Hips (in)</label><input data-body="hips"></div><div class="card"><label>Arm length (in)</label><input data-body="arm"><label>Torso length (in)</label><input data-body="torso"><label>Inseam (in)</label><input data-body="inseam"><label>Leg length (in)</label><input data-body="leg"><label>Foot size</label><input data-body="foot"></div></div><button class="btn primary" id="saveBody" style="margin-top:12px">Save measurements</button></section>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let closet=JSON.parse(localStorage.closet||'[]'),fits=JSON.parse(localStorage.fits||'[]'),outfit=[],selected=null,back=false;
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.page').forEach(p=>p.classList.remove('active'));$('#'+b.dataset.page).classList.add('active');renderCloset();renderFits()});
function addVisual(item){let d=document.createElement('div');d.className='item '+item.type;d.title=item.name;d.dataset.id=item.id;d.style.background=item.color||'';if(item.type==='necklace')d.style.background='transparent';$('#model').appendChild(d);selected=d;d.onclick=()=>selected=d}
$('#add').onclick=()=>{let n=$('#itemName').value||'Unnamed',c=$('#itemColor').value||'#777',cat=$('#cat').value;let type={Shirts:'shirt',Hoodies:'hoodie',Shorts:'shorts',Pants:'pants',Socks:'shoe',Shoes:'shoe',Necklaces:'necklace'}[cat];let item={id:Date.now(),name:n,color:c,type,cat};closet.push(item);outfit.push(item);localStorage.closet=JSON.stringify(closet);addVisual(item);renderCloset()};
$('#pos').oninput=e=>{if(selected)selected.style.transform=`translateY(${e.target.value}px) scale(${+$('#scale').value/100})`};$('#scale').oninput=e=>{if(selected)selected.style.transform=`translateY(${$('#pos').value}px) scale(${e.target.value/100})`};$('#zip').oninput=e=>{if(selected&&selected.classList.contains('hoodie'))selected.style.clipPath=`inset(${100-e.target.value}% 0 0 0 round 32px)`};
$('#saveFit').onclick=()=>{fits.push({id:Date.now(),name:'Fit '+(fits.length+1),items:outfit.map(x=>x.id)});localStorage.fits=JSON.stringify(fits);renderFits()};
$('#turn').onclick=()=>{back=!back;$('#model').style.transform=back?'rotateY(180deg)':''};$('#view2d').onclick=()=>alert('2D view active');$('#view3d').onclick=()=>alert('3D preview mode is ready for the next upgrade.');
function renderCloset(){$('#closetGrid').innerHTML=closet.map(x=>`<div class="card closet-item"><b>${x.name}</b><span class="muted">${x.cat} · ${x.color}</span><button class="btn" onclick="useItem(${x.id})">Add to outfit</button></div>`).join('')||'<p class="muted">No items yet.</p>'}function useItem(id){let x=closet.find(y=>y.id===id);if(x){outfit.push(x);addVisual(x)}}function renderFits(){$('#fitsGrid').innerHTML=fits.map(x=>`<div class="card"><b>${x.name}</b><p class="muted">${x.items.length} items</p></div>`).join('')||'<p class="muted">No saved fits yet.</p>'}
$$('[data-body]').forEach(i=>i.value=localStorage['body_'+i.dataset.body]||'');$('#saveBody').onclick=()=>{$$('[data-body]').forEach(i=>localStorage['body_'+i.dataset.body]=i.value);alert('Saved on this device.')};renderCloset();renderFits();
</script></body></html>
