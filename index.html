<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitLab</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font:15px Arial}header{padding:16px;border-bottom:1px solid #222;position:sticky;top:0;background:#090909;z-index:2}main{max-width:1100px;margin:auto;padding:16px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button{background:#171717;color:#eee;border:1px solid #333;border-radius:9px;padding:9px 12px}button.active{background:#eee;color:#111}.page{display:none}.activePage{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#111;border:1px solid #292929;border-radius:14px;padding:15px}label{display:block;color:#aaa;margin:9px 0 5px}input,select{width:100%;padding:10px;background:#090909;color:#fff;border:1px solid #333;border-radius:8px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}.item{background:#151515;padding:10px;border-radius:12px}.item img{width:100%;height:150px;object-fit:contain;background:#090909;border-radius:8px}.modelbox{height:560px;background:#151515;border:1px solid #292929;border-radius:15px;display:flex;align-items:center;justify-content:center;perspective:900px;overflow:hidden}.model{width:230px;height:510px;position:relative;transform-style:preserve-3d;transition:transform .3s}.head{position:absolute;top:5px;left:83px;width:64px;height:76px;background:#000;border-radius:50%}.neck{position:absolute;top:68px;left:99px;width:32px;height:50px;background:#000}.torso{position:absolute;top:105px;left:54px;width:122px;height:190px;background:#000;border-radius:45% 45% 22% 22%}.arm{position:absolute;top:115px;width:35px;height:180px;background:#000;border-radius:20px}.l{left:25px;transform:rotate(7deg)}.r{right:25px;transform:rotate(-7deg)}.leg{position:absolute;top:280px;width:52px;height:220px;background:#000;border-radius:18px}.leg.l{left:61px}.leg.r{right:61px}.layer{position:absolute;left:50%;transform:translateX(-50%);object-fit:contain;pointer-events:auto}.shirt{top:110px;max-width:180px;max-height:190px}.hoodie,.zipup{top:102px;max-width:190px;max-height:205px}.bottom{top:275px;max-width:180px;max-height:190px}.socks{top:410px;max-width:100px;max-height:85px}.shoes{top:470px;max-width:190px;max-height:45px}.necklace{top:120px;max-width:100px;max-height:100px}.note{color:#999;border:1px solid #333;padding:10px;border-radius:8px}</style></head><body><header><h1>FitLab</h1><div class="tabs"><button class="active" onclick="page('builder',this)">Builder</button><button onclick="page('closet',this)">My Closet</button><button onclick="page('fits',this)">Fits</button><button onclick="page('measure',this)">Body Measurements</button></div></header><main><section id="builder" class="page activePage"><div class="grid"><div class="card"><div><button onclick="rot(-45)">↶</button> <button onclick="rot(45)">↷</button> <button onclick="toggle3d()">2D / 3D</button> <button onclick="clearM()">Clear</button></div><div class="modelbox"><div id="model" class="model"><div class="head"></div><div class="neck"></div><div class="torso"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div><div id="layers"></div></div></div><p id="mode" class="note">2D mode · rotate with the buttons</p></div><div class="card"><h3>Add clothing</h3><div class="note">Upload an actual photo of the item. Photos are saved on this device.</div><label>Category</label><select id="cat"><option>Shirts</option><option>Hoodies</option><option>Zip-ups</option><option>Shorts</option><option>Pants</option><option>Socks</option><option>Shoes</option><option>Necklaces</option></select><label>Name</label><input id="name" placeholder="black zip-up"><label>Photo</label><input id="photo" type="file" accept="image/*"><button style="margin-top:10px" onclick="add()">Add to closet</button></div></div></section><section id="closet" class="page"><div class="card"><h2>My Closet</h2><div id="closetList" class="items"></div></div></section><section id="fits" class="page"><div class="card"><h2>Fits</h2><input id="fitName" placeholder="Fit name"><button style="margin-top:8px" onclick="saveFit()">Save current fit</button><div id="fitsList" class="items"></div></div></section><section id="measure" class="page"><div class="card"><h2>Body Measurements</h2><div class="note">Measure in inches. For arm length, measure ONE arm only. Do not measure wingspan.</div><div class="grid"><div><label>Waist to neck</label><input data-m="waistNeck" type="number" step=".1"></div><div><label>One arm length</label><input data-m="armLength" type="number" step=".1"></div><div><label>Shoulder length</label><input data-m="shoulderLength" type="number" step=".1"></div><div><label>Neck height</label><input data-m="neckHeight" type="number" step=".1"></div><div><label>Head height</label><input data-m="headHeight" type="number" step=".1"></div><div><label>Leg length</label><input data-m="legLength" type="number" step=".1"></div><div><label>US men's shoe size range</label><input data-m="shoeSize" placeholder="9–9.5"></div></div><button style="margin-top:12px" onclick="saveM()">Save measurements</button><p id="msg"></p></div></section></main><script>let closet=JSON.parse(localStorage.getItem('fl_closet')||'[]'),fits=JSON.parse(localStorage.getItem('fl_fits')||'[]'),angle=0,is3d=false;function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('activePage'));document.getElementById(id).classList.add('activePage');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function add(){let f=photo.files[0];if(!f)return alert('Choose a photo first.');let r=new FileReader;r.onload=()=>{closet.push({id:Date.now(),name:name.value||f.name,cat:cat.value,img:r.result});localStorage.setItem('fl_closet',JSON.stringify(closet));render()};r.readAsDataURL(f)}function render(){closetList.innerHTML=closet.map(x=>`<div class=item><img src="${x.img}"><b>${x.name}</b><div>${x.cat}</div><button onclick="put(${x.id})">Put on model</button><button onclick="del(${x.id})">Delete</button></div>`).join('');fitsList.innerHTML=fits.map((x,i)=>`<div class=item><b>${x.name}</b><button onclick="loadFit(${i})">Load</button><button onclick="fits.splice(${i},1);localStorage.setItem('fl_fits',JSON.stringify(fits));render()">Delete</button></div>`).join('')}function put(id){let x=closet.find(a=>a.id===id),map={Shirts:'shirt',Hoodies:'hoodie','Zip-ups':'zipup',Shorts:'bottom',Pants:'bottom',Socks:'socks',Shoes:'shoes',Necklaces:'necklace'},c=map[x.cat];document.querySelectorAll('.layer.'+c).forEach(e=>e.remove());let i=document.createElement('img');i.src=x.img;i.className='layer '+c;layers.appendChild(i)}function del(id){closet=closet.filter(x=>x.id!==id);localStorage.setItem('fl_closet',JSON.stringify(closet));render()}function rot(v){angle+=v;model.style.transform=`rotateY(${angle}deg) rotateX(${is3d?8:0}deg)`}function toggle3d(){is3d=!is3d;model.style.transform=`rotateY(${angle}deg) rotateX(${is3d?8:0}deg) rotateZ(${is3d?1:0}deg)`;mode.textContent=is3d?'3D mode · use ↶ / ↷ to rotate':'2D mode · rotate with the buttons'}function clearM(){layers.innerHTML=''}function saveFit(){fits.push({name:fitName.value||'Untitled fit',html:layers.innerHTML});localStorage.setItem('fl_fits',JSON.stringify(fits));render()}function loadFit(i){layers.innerHTML=fits[i].html}function saveM(){let m={};document.querySelectorAll('[data-m]').forEach(x=>m[x.dataset.m]=x.value);localStorage.setItem('fl_measure',JSON.stringify(m));msg.textContent='Saved on this device.'}let m=JSON.parse(localStorage.getItem('fl_measure')||'{}');document.querySelectorAll('[data-m]').forEach(x=>x.value=m[x.dataset.m]||'');render();</script></body></html>
